# Tests on every push and pull request; static Linux binaries for x86_64, arm64 and armv7.
# Pushing a tag vX.Y.Z also publishes them as a GitHub release (install.sh fetches from there).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=rust-homekit-cam-${{ matrix.arch }}-linux
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/rust-homekit-cam dist/$name/
          cp deploy/rust-homekit-cam@.service config.example.toml README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: rust-homekit-cam-${{ matrix.arch }}-linux
          path: dist/*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS
