[package]
name = "rust-homekit-cam"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"
description = "RTSP, ONVIF and UniFi Protect cameras and doorbells as native HomeKit accessories, no transcoding"
repository = "https://github.com/joaodforce/rust-homekit-cam"

[dependencies]
aes = "0.8"
chacha20poly1305 = "0.10"
ctr = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
md-5 = "0.10"
mdns-sd = "0.22.0"
num-bigint = "0.4"
opus = "0.4"
oxideav-aac = "0.1.7"
rand_core = { version = "0.6", features = ["getrandom"] }
roxmltree = "0.20"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
symphonia-codec-aac = "0.6"
symphonia-core = "0.6"
toml = { version = "0.8", default-features = false, features = ["parse"] }
x25519-dalek = "2"

# libopus NEON intrinsics fail to build for armv7 with zig; plain C is plenty for 16 kHz speech
[target.'cfg(target_arch = "arm")'.dependencies]
opusic-sys = { version = "0.7", features = ["no-simd"] }

# oxideav-aac 0.1.7 + two encoder speed fixes (FFT-based MDCT, allocation-free bit counting):
# ~8x faster AAC encoding for recordings. Branch rust-homekit-cam-speed of our fork; upstream
# master has both fixes, so drop this once oxideav-aac 0.1.8 is released.
[patch.crates-io]
oxideav-aac = { git = "https://github.com/joaodforce/oxideav-aac", rev = "197da336bdb3b11e582277692c7a05b322dd8914" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
