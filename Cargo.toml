[package]
name = "rust-homekit-cam"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "UniFi Protect cameras and doorbells as native HomeKit accessories, no transcoding"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
mdns-sd = "0.22.0"
num-bigint = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
x25519-dalek = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
