# One file per camera: /etc/rust-homekit-cam/<name>.toml (mode 0600), run by
# rust-homekit-cam@<name>.service. Never commit a real one: RTSP credentials, API keys and the
# ring token are secrets. Every key is explained in docs/configuration.md.
name = "Doorbell"
doorbell = true                  # false: a plain camera
# manufacturer = "Acme"          # shown in the Home app's accessory details
# model = "Doorbell 2000"
hap_port = 51830                 # different for each camera on the same host

# Motion Sensor (the trigger for HomeKit Secure Video): default on with [protect];
# set motion = true to feed it with POST /motion. Off motion_hold seconds after the last trigger.
# motion = true
# motion_hold = 10

# Rings and motion arrive as POST /ring, POST /motion with "Authorization: Bearer <ring_token>" (from HA, a webhook…).
# Optional; a different port for each camera on the same host.
ring_listen = "0.0.0.0:8780"
ring_token = "change-me"

# Snapshots for the Home app: the camera's JPEG URL (plain http, Basic/Digest from the URL).
# With [protect] and no snapshot_url, Protect's snapshot API is used.
# snapshot_url = "http://user:password@192.0.2.10/cgi-bin/snapshot.cgi"

# The camera's H.264 RTSP streams: one URL is enough; with several, the one that fits the
# bitrate the iPhone asks for is used. Credentials go in the URL (Basic or Digest).
[rtsp]
high = "rtsp://user:password@192.0.2.10:554/stream1"     # main stream
low = "rtsp://user:password@192.0.2.10:554/stream2"      # sub stream
# medium = "…"
# allow_high = true   # use high only when the iPhone asks for ≥ 4 Mbps (default: medium first)

# ---- UniFi Protect (optional) -------------------------------------------------------------
# RTSP: Protect → camera → Settings → Advanced → RTSP; plain rtsp://<console>:7447/<alias>,
# no credentials (the alias is the secret); high/medium/low = the camera's three channels.
#
# Two-way audio, snapshots, rings and motion: an API key (UniFi OS → Settings → Control Plane → Integrations), the camera's
# id, and the console's certificate fingerprint (logged on first use if unset). The service
# host must reach the camera on UDP 7004 (mind camera-VLAN firewall rules).
# [protect]
# token = "…"
# camera_id = "…"
# host = "192.0.2.1"            # default: the RTSP host
# cert_sha256 = "AB:CD:…"
# motion = "smart"              # "smart": person/vehicle/animal/package; "any": all motion
