# Copy to /etc/rust-homekit-cam.toml (mode 0600). Never commit the real one: the RTSP alias
# and the ring token are secrets.
name = "Doorbell"
doorbell = true
hap_port = 51830
state_dir = "/var/lib/rust-homekit-cam"

# Rings arrive as POST /ring with "Authorization: Bearer <ring_token>".
ring_listen = "0.0.0.0:8780"
ring_token = "change-me"

# Two-way audio: a Protect API key (UniFi OS → Settings → Control Plane → Integrations),
# the camera's id, and the console's certificate fingerprint (logged on first use if unset).
# The service host must be able to reach the camera on UDP 7004 (camera VLAN firewall!).
protect_token = "…"
protect_camera_id = "…"
# protect_host = "192.0.2.1"   # default: the RTSP host
# protect_cert_sha256 = "AB:CD:…"

# Protect: Settings → camera → Advanced → RTSP. Plain RTSP (port 7447) on the LAN.
[rtsp]
high = "rtsp://192.0.2.1:7447/xxxxxxxxxxxxxxxx"
medium = "rtsp://192.0.2.1:7447/yyyyyyyyyyyyyyyy"
low = "rtsp://192.0.2.1:7447/zzzzzzzzzzzzzzzz"
# allow_high = true   # use High (10 Mbps) when the iPhone asks for ≥ 4 Mbps
